---
macos_disabled_symbolic_hotkeys:
  # Native macOS shortcuts that steal chords commonly used by WezTerm/skhd,
  # AeroSpace, and yabai-style window management.
  - id: 7 # Spotlight search (Cmd-Space)
  - id: 32 # Mission Control
  - id: 33 # Application windows
  - id: 34 # Show Desktop
  - id: 35 # Dashboard / legacy Mission Control action
  - id: 36 # Move left a Space
  - id: 37 # Move right a Space
  - id: 60
    # Previous input source (Ctrl-Space). Conflicts with WezTerm leader.
    parameters: [32, 49, 262144]
  - id: 61
    # Next input source (Ctrl-Option-Space).
    parameters: [32, 49, 786432]
  - id: 64 # Finder Spotlight window
  - id: 79 # Move focus to menu bar
  - id: 80 # Move focus to Dock
  - id: 81 # Move focus to active/all windows
  - id: 82 # Move focus to window toolbar
  # Switch to Desktop 1-12. These collide with external workspace managers.
  - id: 118
  - id: 119
  - id: 120
  - id: 121
  - id: 122
  - id: 123
  - id: 124
  - id: 125
  - id: 126
  - id: 127
  - id: 128
  - id: 129

