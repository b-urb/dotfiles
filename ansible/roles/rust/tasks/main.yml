---
- name: check if rustup is installed
  ansible.builtin.command:
    argv:
      - rustup
      - --version
  environment:
    PATH: "/opt/homebrew/opt/rustup/bin:/usr/local/opt/rustup/bin:{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
  register: rustup_check
  changed_when: false
  failed_when: false

- name: install rustup
  ansible.builtin.shell:
    cmd: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
  when: rustup_check.rc != 0

- name: set stable as default toolchain
  ansible.builtin.command:
    argv:
      - rustup
      - default
      - stable
  environment:
    PATH: "/opt/homebrew/opt/rustup/bin:/usr/local/opt/rustup/bin:{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
  changed_when: false

- name: resolve cargo executable
  ansible.builtin.command:
    argv:
      - rustup
      - which
      - cargo
  environment:
    PATH: "/opt/homebrew/opt/rustup/bin:/usr/local/opt/rustup/bin:{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
  register: cargo_executable
  changed_when: false

- name: check installed cargo crates
  ansible.builtin.command:
    argv:
      - "{{ cargo_executable.stdout }}"
      - install
      - --list
  register: cargo_installed
  changed_when: false

- name: install cargo crates
  ansible.builtin.command:
    argv: "{{ [cargo_executable.stdout, 'install'] + (item | split) }}"
  loop: "{{ cargo_crates }}"
  environment:
    PATH: "/opt/homebrew/opt/rustup/bin:/usr/local/opt/rustup/bin:{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
  changed_when: false
  failed_when: false
  register: cargo_install_results

- name: fail when cargo crates could not be installed
  ansible.builtin.assert:
    that:
      - cargo_install_results.results | selectattr('rc', 'ne', 0) | list | length == 0
    fail_msg: >-
      Failed cargo crates:
      {{ cargo_install_results.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}
